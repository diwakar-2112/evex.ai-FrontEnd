  <div class="container">
    <!-- <div class="theme-toggle">
        <button (click)="toggleDarkMode()" class="theme-toggle-btn">
          <i class="bi" [ngClass]="isDarkMode ? 'bi-sun' : 'bi-moon'"></i>

    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-10">
        <div class="card main-card">
          <div class="card-body">
            <div class="row">
              <div class="col-md-6 left-section">
                <h1 class="display-4 mb-4">Plan Your Journey</h1>
                <p class="lead mb-4">Find the best route for your destination with our advanced route planner.</p>
                <div class="features">
                  <div class="feature-item">
                    <i class="bi bi-clock"></i>
                    <span>Real-time Updates</span>
                  </div>
                  <div class="feature-item">
                    <i class="bi bi-map"></i>
                    <span>Multiple Routes</span>
                  </div>
                  <div class="feature-item">
                    <i class="bi bi-fuel-pump"></i>
                    <span>Fuel Estimates</span>
                  </div>
                </div>
              </div>
                <div class="col-md-6">
                  <div class="search-card">
                    <h2 class="text-center mb-4">Route Search</h2>
                    <form  class="route-form" [formGroup]="searchForm">
                      <div class="location-input mb-4">
                        <div class="input-icon">
                          <i class="bi bi-geo-alt-fill start-icon"></i>
                        </div>
                        <select 
                        class="form-select custom-select"
                        formControlName="startingPoint"
                        (change)="getLines($event,'startingPoint')"
                        required
                      >
                        <option  value=""  selected>Choose staring point</option>
                        <option *ngFor="let location of lineData" [value]="location.station_code">
                          {{location.station_name}}
                        </option>
                        
                      </select>
                      
                      </div>
                      
                      <div class="route-connector">
                        <div class="connector-line"></div>
                        <button type="button" class="swap-btn" (click)="swapLocations()">
                          <i class="bi bi-arrow-down-up"></i>
                        </button>
                      </div>
    
                      <div class="location-input mb-4">
                        <div class="input-icon">
                          <i class="bi bi-geo-alt-fill end-icon"></i>
                        </div>
                        <select 
                          class="form-select custom-select" 
                          id="endPoint" 
                          name="endPoint"
                          (change)="getLines($event,'endingPoint')"
                          formControlName="endingPoint"
                          required>
                          <option value="" disabled selected>Select destination</option>
                          <option *ngFor="let location of lineData" [value]="location.station_code">
                            {{location.station_name}}
                          </option>
                        </select>
                      </div>
    
                      <button (click)="findRoute()" type="submit" class="btn btn-primary btn-lg w-100 search-btn">
                        <i class="bi bi-search me-2"></i>
                        Find Route
                      </button>
                    </form>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <ng-template #apiErrorStatusModal let-modal>
    
      <div class="modal-body">
       
          <div class="col-12 line_modal">
            <div class="line_color">{{this.lineValue}}</div>
            <div class="line_color">{{ lineColor.split(' ') | slice:0:1 }}
            </div>
          </div>
 
        <div class="row mx-0 text-left line_station">
          <ul class="vertical-line-list">
            <li (click)="setStationCode(item.station_code)" *ngFor="let item of eachLineData;let i = index" [attr.data-index]="i + 1">{{item.station_name}}</li>
          </ul>
        </div>
      </div>
      <!-- <div class="popup-border text-center">
        <button class="btn btn-danger" type="button" data-dismiss="modal" (click)="closeModal()">OK</button>
      </div> -->
  
  </ng-template>
